<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Portrait of a woman">
  <defs>
    <clipPath id="ring">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
    <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6e9b"/>
      <stop offset="1" stop-color="#465879"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#443330"/>
      <stop offset="1" stop-color="#2e2220"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#ring)">
    <rect width="64" height="64" fill="#e9e3da"/>

    <!-- hair mass behind the head -->
    <path d="M17 33c0-11 6-18 15-18s15 7 15 18c0 6-1 11-3 15l-5-2c1-3 2-6 2-9-2 2-5 3-9 3s-7-1-9-3c0 3 1 6 2 9l-5 2c-2-4-3-9-3-15z" fill="url(#hair)"/>

    <!-- neck -->
    <path d="M27 40h10v9c0 2-2 3-5 3s-5-1-5-3z" fill="#d99f78"/>

    <!-- shoulders -->
    <path d="M6 64c1-9 8-14 16-16.5l10-2 10 2C50 50 57 55 58 64z" fill="url(#sweater)"/>
    <path d="M26 44.8 32 51l6-6.2" stroke="#cbd5e6" stroke-width="2.6" stroke-linecap="round" fill="none"/>

    <!-- face -->
    <ellipse cx="32" cy="30.5" rx="10.6" ry="12.4" fill="#f0c4a1"/>
    <circle cx="20.6" cy="32" r="2.2" fill="#e8b892"/>
    <circle cx="43.4" cy="32" r="2.2" fill="#e8b892"/>

    <!-- fringe -->
    <path d="M21.4 29c-.4-8 4.2-13.6 10.6-13.6S43 21 42.6 29c-1.2-4-3.6-6.6-6-7.6-2.8 1.8-5.8 2.3-8.6 1.4-2.4 1.5-5.4 3.2-6.6 6.2z" fill="url(#hair)"/>

    <!-- brows -->
    <path d="M26.4 27.4c1.1-.7 2.5-.7 3.6 0M34 27.4c1.1-.7 2.5-.7 3.6 0" stroke="#6d5248" stroke-width="1.2" stroke-linecap="round" fill="none"/>

    <!-- eyes -->
    <circle cx="28" cy="29.8" r="1.15" fill="#3b2c28"/>
    <circle cx="36" cy="29.8" r="1.15" fill="#3b2c28"/>

    <!-- nose + smile -->
    <path d="M32 31.6v2.4" stroke="#d3a07c" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M29 36.2c1.7 1.5 4.3 1.5 6 0" stroke="#b9745a" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- soft blush -->
    <circle cx="25.6" cy="34" r="2" fill="#e8a98c" opacity=".55"/>
    <circle cx="38.4" cy="34" r="2" fill="#e8a98c" opacity=".55"/>
  </g>

  <circle cx="32" cy="32" r="31.5" fill="none" stroke="rgba(55,53,47,.12)" stroke-width="1"/>
</svg>
