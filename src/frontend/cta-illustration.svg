<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-label="Illustration of a school workspace dashboard">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2383e2"/>
      <stop offset="1" stop-color="#8ec5ef"/>
    </linearGradient>
    <linearGradient id="barSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2f5"/>
      <stop offset="1" stop-color="#e6eef6"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f0e6"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#37352f" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ambient accents -->
  <circle cx="56" cy="56" r="34" fill="#d3e5ef" opacity="0.7"/>
  <circle cx="510" cy="268" r="44" fill="#dbeddb" opacity="0.6"/>
  <circle cx="506" cy="52" r="10" fill="#2383e2" opacity="0.85"/>
  <circle cx="44" cy="272" r="6" fill="#a97600" opacity="0.7"/>

  <!-- window -->
  <g filter="url(#soft)">
    <rect x="70" y="40" width="420" height="240" rx="18" fill="#ffffff" stroke="#37352f" stroke-opacity="0.14"/>
  </g>

  <!-- window bar -->
  <rect x="70" y="40" width="420" height="34" rx="18" fill="#fbfbfa"/>
  <rect x="70" y="58" width="420" height="16" fill="#fbfbfa"/>
  <line x1="70" y1="74" x2="490" y2="74" stroke="#37352f" stroke-opacity="0.09"/>
  <circle cx="90" cy="57" r="4" fill="#ff5f57"/>
  <circle cx="104" cy="57" r="4" fill="#febc2e"/>
  <circle cx="118" cy="57" r="4" fill="#28c840"/>

  <!-- page cover strip -->
  <rect x="126" y="74" width="364" height="30" fill="url(#cover)"/>
  <line x1="126" y1="104" x2="490" y2="104" stroke="#37352f" stroke-opacity="0.06"/>

  <!-- sidebar -->
  <path d="M126 74 h-38 a18 18 0 0 0 -18 18 v170 a18 18 0 0 0 18 18 h38 z" fill="#fbfbfa"/>
  <line x1="126" y1="74" x2="126" y2="280" stroke="#37352f" stroke-opacity="0.09"/>
  <rect x="84" y="86" width="30" height="7" rx="3.5" fill="#37352f" opacity="0.5"/>
  <rect x="84" y="102" width="24" height="6" rx="3" fill="#37352f" opacity="0.18"/>
  <rect x="80" y="122" width="36" height="9" rx="4.5" fill="#d3e5ef"/>
  <rect x="80" y="122" width="7" height="9" rx="3.5" fill="#2383e2"/>
  <rect x="84" y="140" width="30" height="6" rx="3" fill="#37352f" opacity="0.18"/>
  <rect x="84" y="156" width="26" height="6" rx="3" fill="#37352f" opacity="0.18"/>
  <rect x="84" y="172" width="32" height="6" rx="3" fill="#37352f" opacity="0.18"/>
  <rect x="80" y="196" width="36" height="9" rx="4.5" fill="#dbeddb"/>

  <!-- KPI cards -->
  <g>
    <rect x="142" y="118" width="102" height="46" rx="10" fill="#ffffff" stroke="#37352f" stroke-opacity="0.09"/>
    <rect x="154" y="130" width="34" height="7" rx="3.5" fill="#37352f" opacity="0.2"/>
    <rect x="154" y="143" width="22" height="10" rx="4" fill="#12874a" opacity="0.85"/>

    <rect x="254" y="118" width="102" height="46" rx="10" fill="#ffffff" stroke="#37352f" stroke-opacity="0.09"/>
    <rect x="266" y="130" width="34" height="7" rx="3.5" fill="#37352f" opacity="0.2"/>
    <rect x="266" y="143" width="26" height="10" rx="4" fill="#2383e2" opacity="0.85"/>

    <rect x="366" y="118" width="102" height="46" rx="10" fill="#ffffff" stroke="#37352f" stroke-opacity="0.09"/>
    <rect x="378" y="130" width="34" height="7" rx="3.5" fill="#37352f" opacity="0.2"/>
    <rect x="378" y="143" width="18" height="10" rx="4" fill="#a97600" opacity="0.8"/>
  </g>

  <!-- bar chart -->
  <rect x="142" y="176" width="216" height="88" rx="10" fill="#ffffff" stroke="#37352f" stroke-opacity="0.09"/>
  <rect x="156" y="188" width="52" height="7" rx="3.5" fill="#37352f" opacity="0.2"/>
  <g>
    <rect x="160" y="222" width="16" height="28" rx="4" fill="url(#barSoft)"/>
    <rect x="186" y="210" width="16" height="40" rx="4" fill="url(#barSoft)"/>
    <rect x="212" y="198" width="16" height="52" rx="4" fill="url(#bar)"/>
    <rect x="238" y="216" width="16" height="34" rx="4" fill="url(#barSoft)"/>
    <rect x="264" y="192" width="16" height="58" rx="4" fill="url(#bar)"/>
    <line x1="154" y1="252" x2="346" y2="252" stroke="#37352f" stroke-opacity="0.14"/>
  </g>

  <!-- session list -->
  <rect x="366" y="176" width="102" height="88" rx="10" fill="#ffffff" stroke="#37352f" stroke-opacity="0.09"/>
  <circle cx="380" cy="196" r="3.5" fill="#12874a"/>
  <rect x="390" y="192" width="62" height="6" rx="3" fill="#37352f" opacity="0.22"/>
  <circle cx="380" cy="214" r="3.5" fill="#a97600"/>
  <rect x="390" y="210" width="52" height="6" rx="3" fill="#37352f" opacity="0.22"/>
  <circle cx="380" cy="232" r="3.5" fill="#12874a"/>
  <rect x="390" y="228" width="58" height="6" rx="3" fill="#37352f" opacity="0.22"/>
  <circle cx="380" cy="250" r="3.5" fill="#12874a"/>
  <rect x="390" y="246" width="44" height="6" rx="3" fill="#37352f" opacity="0.22"/>

  <!-- floating notification card -->
  <g filter="url(#soft)">
    <rect x="24" y="214" width="150" height="54" rx="14" fill="#ffffff" stroke="#37352f" stroke-opacity="0.1"/>
  </g>
  <rect x="38" y="228" width="26" height="26" rx="8" fill="#dbeddb"/>
  <path d="M45 241 l4 4 l8 -9" fill="none" stroke="#12874a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="74" y="228" width="84" height="7" rx="3.5" fill="#37352f" opacity="0.28"/>
  <rect x="74" y="242" width="60" height="6" rx="3" fill="#37352f" opacity="0.16"/>
</svg>
