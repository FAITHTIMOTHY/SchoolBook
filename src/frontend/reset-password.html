<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Choose a new password for your SchoolBook account.">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset password | SchoolBook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('schoolbook-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        // ignore storage restrictions
      }
    })();
  </script>
</head>

<body>
  <button type="button" class="auth-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span id="theme-toggle-icon">🌙</span>
  </button>

  <main class="auth-status">
    <div class="auth-status-card" style="text-align: left;">
      <div class="auth-mobile-brand" style="display: flex;">
        <img src="logo.png" alt="">
        <span>SchoolBook</span>
      </div>

      <h1 style="text-align: left;">Choose a new password</h1>
      <p style="text-align: left;">
        Use at least 8 characters. A longer passphrase with numbers and symbols is safer.
      </p>

      <div class="auth-alert" id="reset-alert" role="alert" aria-live="polite" hidden>
        <span class="auth-alert-icon" id="reset-alert-icon">!</span>
        <span id="reset-alert-text"></span>
      </div>

      <form class="auth-form" id="reset-form" novalidate>
        <div class="auth-field">
          <label for="new-password">New password</label>
          <div class="password-wrap">
            <input class="auth-input" id="new-password" type="password" autocomplete="new-password"
              placeholder="At least 8 characters" required minlength="8">
            <button class="password-toggle" id="toggle-password" type="button" aria-label="Show password">
              Show
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="confirm-password">Confirm new password</label>
          <input class="auth-input" id="confirm-password" type="password" autocomplete="new-password"
            placeholder="Repeat your new password" required minlength="8">
        </div>

        <button class="auth-submit" id="reset-submit" type="submit">Update password</button>
      </form>

      <p class="auth-help" style="text-align: left;">
        <a href="/login">Back to sign in</a>
      </p>
    </div>
  </main>

  <script src="reset-password.js"></script>
</body>

</html>
