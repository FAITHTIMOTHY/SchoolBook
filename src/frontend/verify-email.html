<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Verify your SchoolBook email address.">
  <meta name="robots" content="noindex, nofollow">
  <title>Verify email | SchoolBook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('schoolbook-theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        // ignore storage restrictions
      }
    })();
  </script>
</head>

<body>
  <button type="button" class="auth-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span id="theme-toggle-icon">🌙</span>
  </button>

  <main class="auth-status">
    <div class="auth-status-card">
      <div class="auth-status-icon" id="status-icon" aria-hidden="true">
        <span class="spinner" style="border-color: rgba(31, 111, 92, 0.2); border-top-color: var(--auth-accent);"></span>
      </div>

      <h1 id="status-title">Verifying your email…</h1>
      <p id="status-message">Please wait while we confirm this email address.</p>

      <div class="auth-alert" id="status-alert" role="alert" aria-live="polite" hidden>
        <span class="auth-alert-icon" id="status-alert-icon">!</span>
        <span id="status-alert-text"></span>
      </div>

      <a class="auth-submit" id="status-action" href="/login" style="display: none;">
        Continue to sign in
      </a>
    </div>
  </main>

  <script src="verify-email.js"></script>
</body>

</html>
