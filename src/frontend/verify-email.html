<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Verify your SchoolBook email address.">
  <meta name="robots" content="noindex, nofollow">
  <title>Verify email | SchoolBook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
  <main class="auth-status">
    <div class="auth-status-card">
      <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px;">
        <img src="logo.png" alt="" width="32" height="32" style="border-radius: 6px;">
        <span style="font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em;">SchoolBook</span>
      </div>

      <div class="auth-status-icon" id="status-icon" aria-hidden="true">
        <span class="spinner" style="border-color: rgba(35, 131, 226, 0.2); border-top-color: var(--auth-accent);"></span>
      </div>

      <h1 id="status-title">Verifying your email…</h1>
      <p id="status-message">Please wait while we confirm this email address.</p>

      <div class="auth-alert" id="status-alert" role="alert" aria-live="polite" hidden>
        <span class="auth-alert-icon" id="status-alert-icon">!</span>
        <span id="status-alert-text"></span>
      </div>

      <a class="auth-submit" id="status-action" href="/login" style="display: none;">
        Continue to sign in
      </a>
    </div>
  </main>

  <script src="verify-email.js"></script>
</body>

</html>
